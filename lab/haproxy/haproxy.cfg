global
  log stdout format raw local0

defaults
  mode    tcp
  timeout connect 5s
  timeout client  1m
  timeout server  1m

frontend postgres_in
  bind *:5432
  default_backend postgres_pool

# O primário atende; a réplica só entra quando o primário para de responder.
backend postgres_pool
  option tcp-check
  server primario pg-primary:5432 check inter 2s fall 2 rise 2
  server replica  pg-replica:5432 check inter 2s fall 2 rise 2 backup

listen stats
  mode http
  bind *:8404
  stats enable
  stats uri /
  stats refresh 5s
