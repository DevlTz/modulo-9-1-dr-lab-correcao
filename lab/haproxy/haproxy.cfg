global
  log stdout format raw local0
  external-check preserve-env
  insecure-fork-wanted

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 1m
  timeout server 1m
  timeout check 5s

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend postgres_in
  bind *:5432
  default_backend postgres_pool

backend postgres_pool
  option external-check
  external-check path /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  external-check command /opt/lab/check-writer.sh
  # Ambos dependem da autorização persistente E da consulta SQL.
  # Não há preferência automática pelo antigo primário.
  default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
  server pg-primary pg-primary:5432 check resolvers docker init-addr libc,none
  server pg-replica pg-replica:5432 check resolvers docker init-addr libc,none

listen stats
  mode http
  bind *:8404
  stats enable
  stats uri /
  stats refresh 5s
